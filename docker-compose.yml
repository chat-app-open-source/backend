services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - PORT=8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
    command: yarn dev
    stdin_open: true
    tty: true
