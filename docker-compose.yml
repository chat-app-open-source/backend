version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - PORT=8000
      - CHOKIDAR_USEPOLLING=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
    command: yarn dev
    stdin_open: true
    tty: true
    depends_on:
      - redis
    networks:
      - chatapp-network

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass chatapp_redis_2025 --bind 0.0.0.0
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - chatapp-network

networks:
  chatapp-network:
    driver: bridge

volumes:
  redis_data:
